name: crypto-supertrend-scan

# Pages setting required: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# ("Deploy from a branch" does not work here: commits pushed with GITHUB_TOKEN never
#  trigger a branch-based Pages build, so the site would never update.)

on:
  schedule:
    # Once a day at 00:30 UTC, 30 minutes after the Daily candle closes.
    # Also closes the Weekly bar on Mondays and picks up every 4H bar of the last 24h.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write     # commit data/ and docs/ back to the repo
  pages: write        # publish docs/ to GitHub Pages
  id-token: write     # required by actions/deploy-pages

concurrency:
  group: crypto-supertrend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests (gate)
        run: pytest tests -q

      - name: Scan and build website (docs/)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run_scan.py

      - name: Check website files
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          ls -la docs docs/reports | head -50

      # `git add -A` also stages deleted reports (retention) and the removal of the old reports/ folder
      - name: Commit data and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "scan $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - name: Package docs/ for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
