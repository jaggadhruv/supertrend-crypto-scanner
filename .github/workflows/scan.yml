name: crypto-supertrend-scan

on:
  schedule:
    # Once a day at 00:30 UTC, 30 minutes after the Daily candle closes.
    # That run also closes the Weekly bar on Mondays and picks up every
    # 4H bar closed in the previous 24 hours.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write     # commit state + reports back to the repo
  pages: write        # publish reports/ to GitHub Pages
  id-token: write     # required by actions/deploy-pages

concurrency:
  group: crypto-supertrend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests (gate)
        run: pytest tests -q

      - name: Scan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run_scan.py

      # reports/ keeps only the newest 30 files; `git add -A` stages the deletions too
      - name: Commit state and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "scan $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      # Publish reports/ as the website. index.html = newest report + archive picker.
      - name: Package reports for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
